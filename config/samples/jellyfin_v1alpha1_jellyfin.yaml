apiVersion: jellyfin.jellyops.io/v1alpha1
kind: Jellyfin
metadata:
  name: home-media
  namespace: media
  labels:
    app.kubernetes.io/name: jellyops
spec:
  # CrunchyMonkies Jellyfin 12.3 server (upstream 12.3 + the fork's EncodingHelper patch the
  # distributed-transcoding plugin needs). The tag drives ABI gating (v12.3-jc-0.2.4 -> 12.3);
  # the digest pins the exact build. The image is headless (--nowebclient), so spec.web
  # below supplies the matching web client.
  image: ghcr.io/crunchymonkies/jellyfin:v12.3-jc-0.2.4@sha256:7987029edd1f264cf86b16148a004fe07d038ba92e9459c2685bf3f61c3d08c0
  replicas: 1
  storage:
    config:
      size: 10Gi
      storageClassName: fast-ssd
    cache:
      size: 5Gi
    media:
      - name: movies
        mountPath: /media/movies
        readOnly: true
        nfs:
          server: 10.0.0.10
          path: /export/movies
          mountOptions: ["nfsvers=4.1", "hard"]
        library:
          name: Movies
          collectionType: movies
      - name: tv
        mountPath: /media/tv
        nfs:
          server: 10.0.0.10
          path: /export/tv
          provision: true # shared RWX PV+PVC so workers can reuse it (§8.2)
          storageClassName: nfs-media
        library:
          name: Shows
          collectionType: tvshows
      - name: home-videos
        mountPath: /media/home-videos
        existingClaim: home-videos-pvc
        # no library block -> mounted on disk but NOT registered as a Jellyfin library
  api:
    mode: bootstrap # first-run wizard, mints an API key
    generatedSecretName: home-media-api
    manageLibraries: true
    prune: true
    refreshLibraryOnChange: true
  transcoding: # bounds transcode-cache growth; requires the api block above
    throttle:
      enabled: true # pause a transcode once it runs far enough ahead of the player
      delaySeconds: 180 # optional; Jellyfin default
    segmentDeletion:
      enabled: true # delete already-played segments during playback
      keepSeconds: 720 # optional; Jellyfin default
  service:
    type: ClusterIP
  ingress:
    className: nginx
    host: jellyfin.example.com
    tls:
      secretName: jellyfin-tls
  hardwareAcceleration:
    type: vaapi
    # Prefer a device-plugin resource; without it /dev/dri is hostPath-mounted.
    # The render device is auto-detected at startup either way; set devicePath
    # only to pin a specific node.
    deviceResource: gpu.intel.com/xe
    renderGroupGID: 44
  pluginSelector:
    matchLabels:
      jellyfin.jellyops.io/instance: home-media
  web: # jellyfin-web matching the server version
    image: ghcr.io/crunchymonkies/jellyfin-web:v12.3-jc-0.2.4@sha256:0ae44037c98ab15907bc2105f27c9613f49611c8765117c8302c7b1f8fea213d
    # "volume" mounts the web image into the server pod and has the server host /web
    # (drops --nowebclient), which works behind the single-backend Ingress above.
    # For a separate nginx web-tier use mode: deployment (default) with replicas/resources;
    # that needs the gateway block below, since only Gateway routes /web to the web tier.
    mode: volume
    subPath: usr/share/nginx/html/web
  # gateway: # Uncomment to use Gateway API instead of Ingress (mutually exclusive)
  #   gatewayRef:
  #     name: main-gateway
  #     namespace: infra
  #     sectionName: https
  #   hostname: jellyfin.example.com
  #   annotations:
  #     gateway.example.com/custom: "true"
